name: Compare fyto with BandiView
on:
  push:
    branches: ['perf/fyto-52-comparison']
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download and extract exact releases without installing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($v in @('52','71')){
            $tag=if($v -eq '52'){'v1.0.0.52'}else{'v1.0.0.71-rc.1'}
            $expected=if($v -eq '52'){'71e5b1694ff11cacc11f102bc5de03f94b30826143b62a04bcb994cfd1485baf'}else{'c1e8ce4a1422aa369a797c16d86247b41e8173fe52ed0269493fcbfea71f5f69'}
            $msi=Join-Path $env:RUNNER_TEMP "fyto-$v.msi"
            Invoke-WebRequest "https://github.com/heytoby/fyto/releases/download/$tag/fyto-Setup-1.0.0.$v.msi" -OutFile $msi
            if((Get-FileHash $msi).Hash.ToLowerInvariant() -ne $expected){throw 'Released MSI digest mismatch'}
            $target=Join-Path $pwd "build/released-$v"
            $p=Start-Process msiexec.exe -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`"" -WindowStyle Hidden -Wait -PassThru
            if($p.ExitCode -ne 0){throw 'MSI extraction failed'}
            $exe=@(Get-ChildItem $target -Filter fyto.exe -Recurse)
            if($exe.Count -ne 1 -or $exe[0].VersionInfo.FileVersion -ne "1.0.0.$v"){throw 'Extracted viewer version mismatch'}
          }
          python -m pip install --quiet pillow
          if($LASTEXITCODE){throw 'Pillow installation failed'}
      - name: Prepare official BandiView trial on isolated runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'bandiview-setup.exe'
          Invoke-WebRequest 'https://bandisoft.app/bandiview/BANDIVIEW-SETUP-X64.EXE?20261103091858' -OutFile $setup
          $sig=Get-AuthenticodeSignature $setup
          if($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Bandisoft'){throw 'Vendor signature validation failed'}
          $target=Join-Path $env:RUNNER_TEMP 'bandiview-compare'
          $p=Start-Process $setup -ArgumentList "/S /D:`"$target`"" -WindowStyle Hidden -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Vendor silent install failed'}
          if(!(Test-Path "$target/BandiView.exe")){throw 'Vendor executable missing'}
          "FYTO_BANDIVIEW_DIR=$target" >> $env:GITHUB_ENV
          "FYTO_BANDIVIEW_VERSION=$((Get-Item "$target/BandiView.exe").VersionInfo.FileVersion)" >> $env:GITHUB_ENV
          Get-FileHash $setup
      - name: Compare actual rendered target latency in ABCCBA order
        shell: pwsh
        run: python tests/compare_released_52.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fyto-52-71-comparison
          path: build/compare52/results.json
          if-no-files-found: warn
