name: Publish verified fyto packages

on:
  push:
    branches: [main]
    paths:
      - voidImageViewer/src/version.h
      - .github/workflows/release.yml
      - .github/workflows/build-packages.yml
      - scripts/Build-Release.ps1
      - macos/Build-App.sh
      - voidImageViewer/installer/build-bootstrap.ps1
    tags: ['v1.0.0.*']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fyto-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
      run_id: ${{ steps.version.outputs.run_id }}
      msi_hash: ${{ steps.version.outputs.msi_hash }}
      exe_hash: ${{ steps.version.outputs.exe_hash }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve scanned build
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '
            $2=="VERSION_MAJOR" { major=$3+0 }
            $2=="VERSION_MINOR" { minor=$3+0 }
            $2=="VERSION_REVISION" { revision=$3+0 }
            $2=="VERSION_BUILD" { build=$3+0 }
            END { print major "." minor "." revision "." build }
          ' voidImageViewer/src/version.h)
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag and source version differ" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$tag" "$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          parent=$(git rev-parse HEAD^)
          git diff --exit-code "$parent" HEAD
          trailers=$(git log -1 --format=%B | git interpret-trailers --parse)
          run_id=$(sed -n 's/^Fyto-Build-Run: //p' <<< "$trailers")
          msi_hash=$(sed -n 's/^Fyto-MSI-SHA256: //p' <<< "$trailers")
          exe_hash=$(sed -n 's/^Fyto-EXE-SHA256: //p' <<< "$trailers")
          if [[ ! "$run_id" =~ ^[1-9][0-9]+$ || ! "$msi_hash" =~ ^[0-9a-f]{64}$ || ! "$exe_hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Scan the staged installers and record their digests in the release commit." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" |
            jq -e --arg sha "$parent" --arg repo "$GITHUB_REPOSITORY" --arg branch "build/fyto-$version" '
              .status == "completed" and .conclusion == "success" and .event == "push" and
              .head_sha == $sha and .head_branch == $branch and .head_repository.full_name == $repo and
              .path == ".github/workflows/build-packages.yml"
            ' >/dev/null
          printf 'exists=false\nrun_id=%s\nmsi_hash=%s\nexe_hash=%s\n' "$run_id" "$msi_hash" "$exe_hash" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fyto-Windows-x64
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: fyto-macOS-Universal
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
      - name: Verify and publish the staged files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FYTO_TAG: ${{ needs.resolve.outputs.tag }}
          FYTO_VERSION: ${{ needs.resolve.outputs.version }}
          FYTO_MSI_HASH: ${{ needs.resolve.outputs.msi_hash }}
          FYTO_EXE_HASH: ${{ needs.resolve.outputs.exe_hash }}
        run: |
          msi="fyto-Setup-$FYTO_VERSION.msi"
          exe="fyto-Setup-$FYTO_VERSION.exe"
          mac="fyto-$FYTO_VERSION-macos-universal.zip"
          dmg="fyto-$FYTO_VERSION-macos-universal.dmg"
          (
            cd release-assets
            printf '%s  %s\n%s  %s\n' "$FYTO_MSI_HASH" "$msi" "$FYTO_EXE_HASH" "$exe" | sha256sum -c -
            sed -i 's/\r$//' SHA256SUMS.txt
            sha256sum "$mac" "$dmg" >> SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          assets=(
            "release-assets/$msi"
            "release-assets/$exe"
            "release-assets/fyto-Setup-$FYTO_VERSION.zip"
            "release-assets/fyto-source-$FYTO_VERSION.zip"
            "release-assets/$mac"
            "release-assets/$dmg"
            "release-assets/SHA256SUMS.txt"
          )
          gh release create "$FYTO_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "fyto $FYTO_TAG" --notes-file RELEASE_NOTES.md
