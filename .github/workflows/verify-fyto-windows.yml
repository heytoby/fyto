name: Verify fyto Windows upgrade and installer
on:
  push:
    branches: ['verify/fyto-1.0.0.51']

permissions:
  actions: read
  contents: read

jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fyto-Windows-x64
          run-id: 43624712709
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fyto-verify

      - name: Extract the already scanned installer for performance validation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Join-Path $env:RUNNER_TEMP 'fyto-verify/fyto-Setup-1.0.0.51.msi'
          if ((Get-FileHash -LiteralPath $msi).Hash -ine 'a36ab902974ac55dcef7b762a1f0fdfbc85549a9b3281b5d6e9c392cca320c3e') { throw 'Scanned MSI differs' }
          $target=Join-Path $env:RUNNER_TEMP 'fyto prior installation'
          $p=Start-Process msiexec.exe -ArgumentList ('/a "'+$msi+'" /quiet TARGETDIR="'+$target+'"') -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'MSI extraction failed' }
          $viewer=Get-ChildItem -LiteralPath $target -Filter fyto.exe -Recurse -File | Select-Object -First 1
          if (!$viewer -or $viewer.VersionInfo.FileVersion -ne '1.0.0.51') { throw 'Extracted version differs' }
          Copy-Item -LiteralPath $viewer.FullName -Destination (Join-Path $target 'fyto.exe')

      - uses: actions/checkout@v6
        with:
          fetch-depth: 6
          persist-credentials: false
      - name: Check wheel and arrow directions in the upgraded viewer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --quiet pillow
          if ($LASTEXITCODE) { throw 'Test fixture generator unavailable' }
          $viewer = Join-Path $env:RUNNER_TEMP 'fyto prior installation/fyto.exe'
          python tests/test_fyto_order.py $viewer
          if ($LASTEXITCODE) { throw 'Upgraded viewer navigation regression' }

      - name: Compare JPEG and PNG presentation on the same Windows host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          $sdk = (Get-ChildItem (Join-Path $sdkRoot 'Lib') -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          if (!(Get-Command nasm -ErrorAction SilentlyContinue) -and !(Test-Path 'C:/Program Files/NASM/nasm.exe')) {
            choco install nasm --version=2.16.03 --yes --no-progress
            if ($LASTEXITCODE) { throw 'NASM install failed' }
          }
          ./scripts/Build-Jpeg.ps1
          $baseline = Join-Path $env:RUNNER_TEMP 'fyto-v50-baseline'
          $archive = Join-Path $env:RUNNER_TEMP 'fyto-v50-baseline.zip'
          git archive --format=zip --output="$archive" 2b86a28f25c1bd5e35fa25ad54f8a0cdf135adf3
          if ($LASTEXITCODE) { throw 'Baseline source is unavailable' }
          Expand-Archive -LiteralPath $archive -DestinationPath $baseline
          foreach ($source in @($baseline, $pwd.Path)) {
            python tests/instrument-fyto-performance.py $source
            if ($LASTEXITCODE) { throw 'Performance trace instrumentation failed' }
            & $msbuild (Join-Path $source 'voidImageViewer/vs2019/voidImageViewer.vcxproj') /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 /p:TargetName=fyto /p:PlatformToolset=v143 "/p:WindowsTargetPlatformVersion=$sdk" "/p:ForceImportBeforeCppTargets=$source/build-overrides.targets"
            if ($LASTEXITCODE) { throw 'Performance trace build failed' }
          }
          $viewer = 'voidImageViewer/vs2019/x64/Release/fyto.exe'
          python tests/verify-fyto-performance.py (Join-Path $env:RUNNER_TEMP 'fyto-performance') (Join-Path $baseline $viewer) (Join-Path $pwd.Path $viewer) (Join-Path $env:RUNNER_TEMP 'fyto prior installation/fyto.exe')
          if ($LASTEXITCODE) { throw 'Navigation or performance verification failed' }
