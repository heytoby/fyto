name: Verify fyto Windows upgrade and installer
on:
  push:
    branches: ['verify/fyto-1.0.0.45']

permissions:
  actions: read
  contents: read

jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fyto-Windows-x64
          run-id: 42811555953
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fyto-verify

      - name: Scan the built MSI and EXE with Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'fyto-verify'
          $platform = Join-Path $env:ProgramData 'Microsoft\Windows Defender\Platform'
          $scanner = Get-ChildItem -Path "$platform\*\MpCmdRun.exe" -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$scanner) {
            $scanner = Get-Item -LiteralPath (Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe')
          }
          foreach ($extension in @('msi', 'exe')) {
            $package = Get-Item -LiteralPath (Join-Path $folder "fyto-Setup-1.0.0.45.$extension")
            $scan = & $scanner.FullName -Scan -ScanType 3 -File $package.FullName -DisableRemediation 2>&1
            $scan | Write-Output
            if ($LASTEXITCODE -ne 0 -or ($scan -join ' ') -notmatch 'found no threats') {
              throw "Defender did not return a clean scan for $($package.Name)"
            }
            $sha = (Get-FileHash -LiteralPath $package.FullName).Hash.ToLowerInvariant()
            Write-Output "FYTO_DEFENDER_SCAN $($package.Name) $sha clean"
          }

      - name: Verify the Start menu icon after upgrading from 1.0.0.44
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'fyto-verify'
          $old = Join-Path $env:RUNNER_TEMP 'fyto-Setup-1.0.0.44.msi'
          $new = Join-Path $folder 'fyto-Setup-1.0.0.45.exe'
          $target = Join-Path $env:RUNNER_TEMP 'fyto prior installation'
          Invoke-WebRequest -Uri 'https://github.com/heytoby/fyto/releases/download/v1.0.0.44/fyto-Setup-1.0.0.44.msi' -OutFile $old
          if ((Get-FileHash -LiteralPath $old).Hash -ine '40b4849e8cab9e9a1bc7df18149e7420d49ff41cbd67241dd7f450af0eb13df6') {
            throw 'Published 1.0.0.44 MSI hash changed'
          }
          $msiexec = Join-Path $env:WINDIR 'System32\msiexec.exe'
          function Install-Fyto([string]$package, [string]$logName, [string]$directory) {
            $log = Join-Path $env:RUNNER_TEMP $logName
            $arguments = '/i "{0}" /quiet /norestart /l*v "{1}"' -f $package, $log
            if ($directory) {
              $arguments += ' INSTALLFOLDER="{0}"' -f $directory
            }
            $process = Start-Process $msiexec -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 50 }
              throw "MSI returned $($process.ExitCode)"
            }
          }
          Install-Fyto $old 'fyto-44-install.log' $target
          $viewerPath = Join-Path $target 'fyto.exe'
          if ((Get-Item -LiteralPath $viewerPath).VersionInfo.FileVersion -ne '1.0.0.44') {
            throw 'Expected 1.0.0.44 at the chosen install location'
          }
          $shortcutName = 'fyto ' + [char]0x4e2d + [char]0x6587 + [char]0x7248 + '.lnk'
          $shortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) $shortcutName
          $oldShortcutHash = (Get-FileHash -LiteralPath $shortcut).Hash
          $ini = Join-Path $target 'fyto.ini'
          Set-Content -LiteralPath $ini -Value @('[fyto]', 'fontsize=29')
          $settingsHash = (Get-FileHash -LiteralPath $ini).Hash

          $update = Start-Process -FilePath $new -ArgumentList '/update' -WindowStyle Hidden -PassThru
          if (!$update.WaitForExit(45000)) {
            $update.Kill()
            throw 'The EXE update did not finish in 45 seconds'
          }
          if ($update.ExitCode -notin @(0, 3010)) {
            throw "The EXE update returned $($update.ExitCode)"
          }
          if (!(Test-Path -LiteralPath (Join-Path $target 'wuffs-LICENSE'))) {
            throw 'Installed decoder license is missing'
          }
          $viewer = Get-Item -LiteralPath $viewerPath
          if ($viewer.VersionInfo.FileVersion -ne '1.0.0.45') {
            throw '1.0.0.45 was not installed over 1.0.0.44'
          }
          if ((Get-FileHash -LiteralPath $ini).Hash -ne $settingsHash) {
            throw 'Upgrade changed the existing settings'
          }
          if ((Get-FileHash -LiteralPath $shortcut).Hash -eq $oldShortcutHash) {
            throw 'Upgrade kept the old Start menu shortcut'
          }

          $shell = New-Object -ComObject WScript.Shell
          $testLink = Join-Path $env:RUNNER_TEMP 'fyto-start-verify.lnk'
          [IO.File]::Copy($shortcut, $testLink)
          $link = $shell.CreateShortcut($testLink)
          $bytes = [IO.File]::ReadAllBytes($shortcut)
          $flags = [BitConverter]::ToUInt32($bytes, 20)
          Write-Output ('FYTO_START_LINK_FLAGS 0x{0:X} length {1}' -f $flags, $bytes.Length)
          if ($flags -band 0x1000) {
            throw 'Start menu shortcut is still MSI-advertised'
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          using System.Runtime.InteropServices.ComTypes;
          public static class FytoVerifyShell {
              [ComImport, Guid("00021401-0000-0000-C000-000000000046")]
              private class ShellLink { }
              [ComImport, Guid("000214F9-0000-0000-C000-000000000046"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
              private interface IShellLinkW {
                  [PreserveSig]
                  int GetPath([Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder path, int max, IntPtr findData, uint flags);
              }
              public static string GetTarget(string filename) {
                  object shellLink = new ShellLink();
                  try {
                      ((IPersistFile)shellLink).Load(filename, 0);
                      var path = new StringBuilder(32768);
                      int result = ((IShellLinkW)shellLink).GetPath(path, path.Capacity, IntPtr.Zero, 4);
                      if (result < 0) Marshal.ThrowExceptionForHR(result);
                      return path.ToString();
                  } finally {
                      Marshal.FinalReleaseComObject(shellLink);
                  }
              }
              [DllImport("shell32.dll", EntryPoint = "ExtractIconExW", CharSet = CharSet.Unicode, ExactSpelling = true)]
              public static extern uint ExtractIcon(string path, int index, [Out] IntPtr[] large, [Out] IntPtr[] small, uint count);
              [DllImport("user32.dll")]
              public static extern bool DestroyIcon(IntPtr icon);
          }
          '@
          $targetPath = [FytoVerifyShell]::GetTarget($shortcut)
          if ($targetPath -ine $viewer.FullName) {
            Write-Output "FYTO_START_LINK_BYTES $([Convert]::ToBase64String($bytes))"
            throw "Start menu target is [$targetPath], WScript ASCII copy target is [$($link.TargetPath)], expected [$($viewer.FullName)]"
          }
          if ($link.IconLocation -and $link.IconLocation -ne ',0' -and $link.IconLocation -ine ($viewer.FullName + ',0')) {
            throw "Start menu shortcut uses an unexpected icon source $($link.IconLocation)"
          }
          $large = [IntPtr[]]::new(1)
          $small = [IntPtr[]]::new(1)
          $count = [FytoVerifyShell]::ExtractIcon($targetPath, 0, $large, $small, 1)
          if ($count -eq 0 -or $large[0] -eq [IntPtr]::Zero -or $small[0] -eq [IntPtr]::Zero) {
            throw 'The Start menu shortcut target did not expose the embedded icon'
          }
          [void][FytoVerifyShell]::DestroyIcon($large[0])
          [void][FytoVerifyShell]::DestroyIcon($small[0])
          $hash = (Get-FileHash -LiteralPath $new).Hash.ToLowerInvariant()
          Write-Output "FYTO_START_ICON_44_TO_45 $hash verified"
